<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GB IT Solutions — Reset Admin Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
body{margin:0;background:#050811;color:#fff;font:14px system-ui}
.wrap{width:92%;max-width:620px;margin:auto}
header{padding:18px 0;border-bottom:1px solid #24334b}
main{padding:45px 0}
.panel{background:#0b1220;border:1px solid #24334b;border-radius:18px;padding:25px}
h2{margin-top:0}
input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #315c86;background:#070c15;color:#fff;margin-top:10px}
button{background:#12385d;cursor:pointer;font-weight:700}
.secondary{background:transparent}
.hidden{display:none}
.msg{min-height:22px;margin-top:14px;color:#9aa8bd}
.success{color:#72e6a1}
.error{color:#ff9b9b}
.note{color:#9aa8bd;line-height:1.5}
a{color:#72c7ff}
</style>
</head>
<body>
<header><div class="wrap"><b>GB IT Solutions — Admin Password Reset</b></div></header>
<main class="wrap">
<section class="panel">
<h2>Forgot Admin Password?</h2>
<p class="note">Enter your registered admin email. A one-time password (OTP) will be sent to that email.</p>

<div id="step1">
<input id="email" type="email" placeholder="Admin email" autocomplete="email" required>
<button id="sendBtn" type="button">Send OTP</button>
</div>

<div id="step2" class="hidden">
<input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter 6-digit OTP">
<button id="verifyBtn" type="button">Verify OTP</button>
<p class="note">Didn't receive it? Wait 60 seconds and request a new OTP.</p>
</div>

<div id="step3" class="hidden">
<input id="newPassword" type="password" autocomplete="new-password" placeholder="New password">
<input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm new password">
<button id="resetBtn" type="button">Reset Password</button>
</div>

<p id="msg" class="msg"></p>
<p><a href="admin.html">← Back to Admin Login</a></p>
</section>
</main>

<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const emailEl=document.getElementById('email');
const otpEl=document.getElementById('otp');
const newPasswordEl=document.getElementById('newPassword');
const confirmPasswordEl=document.getElementById('confirmPassword');
const msg=document.getElementById('msg');
const step2=document.getElementById('step2');
const step3=document.getElementById('step3');

function message(text,type=''){
  msg.textContent=text;
  msg.className='msg '+type;
}

document.getElementById('sendBtn').onclick=async()=>{
  const email=emailEl.value.trim().toLowerCase();
  if(!email){message('Please enter your admin email.','error');return;}
  message('Sending OTP...');
  const {error}=await db.auth.resetPasswordForEmail(email);
  if(error){message(error.message,'error');return;}
  step2.classList.remove('hidden');
  message('OTP sent. Check your email.','success');
};

document.getElementById('verifyBtn').onclick=async()=>{
  const email=emailEl.value.trim().toLowerCase();
  const token=otpEl.value.trim();
  if(!/^\d{6}$/.test(token)){message('Please enter the 6-digit OTP.','error');return;}
  message('Verifying OTP...');
  const {data,error}=await db.auth.verifyOtp({email,token,type:'recovery'});
  if(error){message(error.message,'error');return;}
  if(!data?.session){message('OTP verified, but no recovery session was created. Please request a new OTP.','error');return;}
  step3.classList.remove('hidden');
  message('OTP verified. Enter your new password.','success');
};

document.getElementById('resetBtn').onclick=async()=>{
  const p=newPasswordEl.value;
  const c=confirmPasswordEl.value;
  if(p.length<8){message('Password must be at least 8 characters.','error');return;}
  if(p!==c){message('Passwords do not match.','error');return;}
  message('Updating password...');
  const {error}=await db.auth.updateUser({password:p});
  if(error){message(error.message,'error');return;}
  await db.auth.signOut();
  message('Password reset successfully. Redirecting to Admin Login...','success');
  setTimeout(()=>location.href='admin.html',1200);
};
</script>
</body>
</html>

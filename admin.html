<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GB IT Solutions Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<style>
body{margin:0;background:#050811;color:#fff;font:14px system-ui}.wrap{width:94%;max-width:1200px;margin:auto}header{padding:18px 0;border-bottom:1px solid #24334b}main{padding:25px 0}.panel{background:#0b1220;border:1px solid #24334b;border-radius:18px;padding:20px;margin-bottom:18px}input,select,button{padding:11px;border-radius:9px;border:1px solid #315c86;background:#070c15;color:#fff}button{background:#102b48;cursor:pointer}.danger{background:transparent;border-color:#d66}.row{display:flex;gap:10px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{padding:15px;border:1px solid #24334b;border-radius:12px}.stat b{display:block;font-size:25px}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:950px}th,td{padding:10px;border-bottom:1px solid #24334b;text-align:left;vertical-align:top}th{color:#72c7ff}.muted{color:#9aa8bd}.hidden{display:none}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}}
</style></head><body><header><div class="wrap"><b>GB IT Solutions — Admin Panel</b></div></header><main class="wrap">
<section id="login" class="panel"><h2>Admin Login</h2><form id="lf"><div><input id="em" type="email" placeholder="Admin email" required></div><br><div><input id="pw" type="password" placeholder="Password" required></div><br><button>Login</button><p id="msg"></p></form></section>
<section id="dash" class="hidden"><div class="row"><h2 style="margin-right:auto">Bookings</h2><button onclick="load()">Refresh</button><button class="danger" onclick="out()">Logout</button></div>
<div class="stats"><div class="stat">Total<b id="t">0</b></div><div class="stat">Pending<b id="p">0</b></div><div class="stat">Confirmed<b id="c">0</b></div><div class="stat">In Progress<b id="i">0</b></div><div class="stat">Completed<b id="d">0</b></div></div>
<div class="panel"><div class="row"><input id="q" placeholder="Search name/mobile/reference" oninput="render()"><select id="f" onchange="render()"><option>All</option><option>Pending</option><option>Confirmed</option><option>In Progress</option><option>Completed</option><option>Cancelled</option></select></div><br><div class="table"><table><thead><tr><th>Reference</th><th>Customer</th><th>Service</th><th>Problem</th><th>Date</th><th>Address</th><th>Status</th><th>Delete</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let data=[];
async function admin(){let{data:{user}}=await db.auth.getUser();if(!user)return false;let{data:a}=await db.from('admins').select('email').eq('email',user.email).maybeSingle();return !!a}
async function start(){if(await admin()){login.classList.add('hidden');dash.classList.remove('hidden');load()}}start();
lf.onsubmit=async e=>{e.preventDefault();let{error}=await db.auth.signInWithPassword({email:em.value,password:pw.value});if(error)msg.textContent=error.message;else start()};
async function load(){let{data:x,error}=await db.from('bookings').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);data=x||[];render();t.textContent=data.length;p.textContent=data.filter(x=>x.status==='Pending').length;c.textContent=data.filter(x=>x.status==='Confirmed').length;i.textContent=data.filter(x=>x.status==='In Progress').length;d.textContent=data.filter(x=>x.status==='Completed').length}
function render(){let s=document.getElementById('q').value.toLowerCase(),filter=document.getElementById('f').value;let a=data.filter(x=>(filter==='All'||x.status===filter)&&((x.reference||'')+' '+(x.full_name||'')+' '+(x.mobile||'')).toLowerCase().includes(s));rows.innerHTML=a.map(x=>`<tr><td><b>${x.reference}</b><br><span class="muted">${new Date(x.created_at).toLocaleString()}</span></td><td>${x.full_name}<br>${x.mobile}<br>${x.email||''}</td><td>${x.service}<br>${x.device_type}</td><td>${x.problem}</td><td>${x.preferred_datetime?new Date(x.preferred_datetime).toLocaleString():'-'}</td><td>${x.address||'-'}</td><td><select onchange="status('${x.id}',this.value)">${['Pending','Confirmed','In Progress','Completed','Cancelled'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="danger" onclick="del('${x.id}')">Delete</button></td></tr>`).join('')}
async function status(id,s){let{error}=await db.from('bookings').update({status:s}).eq('id',id);if(error)alert(error.message);else load()}
async function del(id){if(!confirm('Delete booking?'))return;let{error}=await db.from('bookings').delete().eq('id',id);if(error)alert(error.message);else load()}
async function out(){await db.auth.signOut();location.reload()}
</script></body></html>

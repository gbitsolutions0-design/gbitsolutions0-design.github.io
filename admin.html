<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GB IT Solutions Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="supabase-config.js"></script><style>body{margin:0;background:#050811;color:#fff;font:14px system-ui}.wrap{width:94%;max-width:1250px;margin:auto}header{padding:18px 0;border-bottom:1px solid #24334b}main{padding:25px 0}.panel{background:#0b1220;border:1px solid #24334b;border-radius:18px;padding:20px;margin-bottom:18px}input,select,button,textarea{padding:11px;border-radius:9px;border:1px solid #315c86;background:#070c15;color:#fff}button{background:#102b48;cursor:pointer}.danger{background:transparent;border-color:#d66}.export{background:#145c3a;border-color:#2da66a}.row{display:flex;gap:10px;flex-wrap:wrap}.tabs button{font-weight:700}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:10px;border-bottom:1px solid #24334b;text-align:left;vertical-align:top}th{color:#72c7ff}.hidden{display:none}.muted{color:#9aa8bd}.formgrid{display:grid;grid-template-columns:2fr 3fr 1fr auto;gap:8px}@media(max-width:800px){.formgrid{grid-template-columns:1fr}.wrap{width:92%}}</style></head><body><header><div class="wrap"><b>GB IT Solutions — Admin Panel</b></div></header><main class="wrap"><section id="login" class="panel"><h2>Admin Login</h2><form id="lf"><input id="em" type="email" placeholder="Admin email" required><input id="pw" type="password" placeholder="Password" required><button>Login</button><p id="msg"></p></form></section><section id="dash" class="hidden"><div class="row"><h2 style="margin-right:auto">Management</h2><button onclick="loadAll()">Refresh</button><button class="danger" onclick="out()">Logout</button></div><div class="tabs row"><button onclick="show('bookings')">📋 Bookings</button><button onclick="show('services')">🛠 Services & Prices</button><button onclick="show('products')">💻 Parts / Products</button><button type="button" onclick="showImages()">🖼️ Images / Gallery</button></div><section id="bookings" class="panel"><div class="row"><h3 style="margin:0 auto 0 0">Bookings</h3><button class="export" onclick="downloadExcel()">⬇️ Download Excel</button></div><br><div class="row"><input id="q" placeholder="Search name/mobile/reference" oninput="renderBookings()"><select id="f" onchange="renderBookings()"><option>All</option><option>Pending</option><option>Confirmed</option><option>In Progress</option><option>Completed</option><option>Cancelled</option></select></div><br><div class="table"><table><thead><tr><th>Reference</th><th>Customer</th><th>Service</th><th>Problem</th><th>Date</th><th>Address</th><th>Status</th><th>Delete</th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="services" class="panel hidden"><h3>Services & Prices</h3><form id="serviceForm" class="formgrid"><input id="sn" placeholder="Service name" required><input id="sd" placeholder="Description"><input id="sp" placeholder="Price e.g. ₹499 / Contact" required><button>+ Add Service</button></form><br><div class="table"><table><thead><tr><th>Name</th><th>Description</th><th>Price</th><th>Visible</th><th>Actions</th></tr></thead><tbody id="serviceRows"></tbody></table></div></section><section id="products" class="panel hidden"><h3>Parts / Products</h3><form id="productForm" class="formgrid"><input id="pn" placeholder="Product name" required><input id="pd" placeholder="Description"><input id="pp" placeholder="Price / Ask for price" required><button>+ Add Product</button></form><br><div class="table"><table><thead><tr><th>Name</th><th>Description</th><th>Price</th><th>Visible</th><th>Actions</th></tr></thead><tbody id="productRows"></tbody></table></div></section></section></main><script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let bookings=[],services=[],products=[];
const admin=async()=>{let{data:{user}}=await db.auth.getUser();if(!user)return false;let{data:a}=await db.from('admins').select('email').eq('email',user.email).maybeSingle();return!!a};
async function start(){if(await admin()){login.classList.add('hidden');dash.classList.remove('hidden');loadAll()}}start();
lf.onsubmit=async e=>{e.preventDefault();let{error}=await db.auth.signInWithPassword({email:em.value,password:pw.value});if(error)msg.textContent=error.message;else start()};
function show(id){['bookings','services','products','images'].forEach(x=>{const el=document.getElementById(x);if(el)el.classList.toggle('hidden',x!==id)})}
async function loadAll(){await Promise.all([loadBookings(),loadServices(),loadProducts()])}
async function loadBookings(){let{data,error}=await db.from('bookings').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);bookings=data||[];renderBookings()}
function getDisplayedBookings(){let s=q.value.toLowerCase(),filter=f.value;return bookings.filter(x=>(filter==='All'||x.status===filter)&&((x.reference||'')+' '+(x.full_name||'')+' '+(x.mobile||'')).toLowerCase().includes(s))}
function renderBookings(){let a=getDisplayedBookings();rows.innerHTML=a.map(x=>`<tr><td><b>${esc(x.reference)}</b><br><span class="muted">${new Date(x.created_at).toLocaleString()}</span></td><td>${esc(x.full_name)}<br>${esc(x.mobile)}<br>${esc(x.email||'')}</td><td>${esc(x.service)}<br>${esc(x.device_type)}</td><td>${esc(x.problem)}</td><td>${x.preferred_datetime?new Date(x.preferred_datetime).toLocaleString():'-'}</td><td>${esc(x.address||'-')}</td><td><select onchange="status('${x.id}',this.value)">${['Pending','Confirmed','In Progress','Completed','Cancelled'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="danger" onclick="del('${x.id}')">Delete</button></td></tr>`).join('')}
function downloadExcel(){let a=getDisplayedBookings();if(!a.length){alert('No bookings to export.');return}let data=a.map(x=>({'Reference':x.reference||'','Customer Name':x.full_name||'','Mobile':x.mobile||'','Email':x.email||'','Service':x.service||'','Device Type':x.device_type||'','Problem':x.problem||'','Preferred Date & Time':x.preferred_datetime?new Date(x.preferred_datetime).toLocaleString():'','Address':x.address||'','Status':x.status||'','Booking Created':x.created_at?new Date(x.created_at).toLocaleString():'','Last Updated':x.updated_at?new Date(x.updated_at).toLocaleString():''}));let ws=XLSX.utils.json_to_sheet(data);ws['!cols']=[{wch:18},{wch:22},{wch:15},{wch:30},{wch:28},{wch:18},{wch:40},{wch:24},{wch:45},{wch:16},{wch:24},{wch:24}];let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Bookings');let stamp=new Date().toISOString().slice(0,10);XLSX.writeFile(wb,'GB_IT_SOLUTIONS_Bookings_'+stamp+'.xlsx')}
async function status(id,s){let{error}=await db.from('bookings').update({status:s,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else loadBookings()}
async function del(id){if(!confirm('Delete booking?'))return;let{error}=await db.from('bookings').delete().eq('id',id);if(error)alert(error.message);else loadBookings()}
async function loadServices(){let{data,error}=await db.from('site_services').select('*').order('sort_order').order('name');if(error)return alert(error.message);services=data||[];serviceRows.innerHTML=services.map(x=>`<tr><td><input id="sn_${x.id}" value="${attr(x.name)}"></td><td><input id="sd_${x.id}" value="${attr(x.description)}"></td><td><input id="sp_${x.id}" value="${attr(x.price)}"></td><td><input type="checkbox" id="sa_${x.id}" ${x.active?'checked':''}></td><td><button onclick="saveService('${x.id}')">Save</button> <button class="danger" onclick="deleteItem('site_services','${x.id}',loadServices)">Delete</button></td></tr>`).join('')}
async function loadProducts(){let{data,error}=await db.from('site_products').select('*').order('sort_order').order('name');if(error)return alert(error.message);products=data||[];productRows.innerHTML=products.map(x=>`<tr><td><input id="pn_${x.id}" value="${attr(x.name)}"></td><td><input id="pd_${x.id}" value="${attr(x.description)}"></td><td><input id="pp_${x.id}" value="${attr(x.price)}"></td><td><input type="checkbox" id="pa_${x.id}" ${x.active?'checked':''}></td><td><button onclick="saveProduct('${x.id}')">Save</button> <button class="danger" onclick="deleteItem('site_products','${x.id}',loadProducts)">Delete</button></td></tr>`).join('')}
serviceForm.onsubmit=async e=>{e.preventDefault();let{error}=await db.from('site_services').insert({name:sn.value,description:sd.value,price:sp.value,sort_order:services.length+1});if(error)alert(error.message);else{e.target.reset();loadServices()}}
productForm.onsubmit=async e=>{e.preventDefault();let{error}=await db.from('site_products').insert({name:pn.value,description:pd.value,price:pp.value,sort_order:products.length+1});if(error)alert(error.message);else{e.target.reset();loadProducts()}}
async function saveService(id){let{error}=await db.from('site_services').update({name:document.getElementById('sn_'+id).value,description:document.getElementById('sd_'+id).value,price:document.getElementById('sp_'+id).value,active:document.getElementById('sa_'+id).checked,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else alert('Service updated')}
async function saveProduct(id){let{error}=await db.from('site_products').update({name:document.getElementById('pn_'+id).value,description:document.getElementById('pd_'+id).value,price:document.getElementById('pp_'+id).value,active:document.getElementById('pa_'+id).checked,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else alert('Product updated')}
async function deleteItem(table,id,fn){if(!confirm('Delete this item?'))return;let{error}=await db.from(table).delete().eq('id',id);if(error)alert(error.message);else fn()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(v){return esc(v)}
async function out(){await db.auth.signOut();location.reload()}
</script><script src="admin-enhancements.js?v=3"></script><script src="admin-enhancements.js"></script></body></html>

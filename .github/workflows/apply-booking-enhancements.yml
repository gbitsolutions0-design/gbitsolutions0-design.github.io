name: Apply booking enhancements
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Add booking enhancement script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="booking-fix.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker in s:
                  s=s.replace(marker, tag+marker, 1)
              else:
                  s += tag
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html booking-fix.js
          git diff --cached --quiet || git commit -m 'Fix booking navigation and email notifications'
          git push
